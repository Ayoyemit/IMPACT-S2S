<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMPACT S2S — Smoking Cessation Strategies{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script>
        // ── Toast helper ──
        function showToast(msg, type='success', duration=3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast--' + type + ' show';
            setTimeout(() => t.classList.remove('show'), duration);
        }

        // ── Fetch helper (never throws: avoids hung "Loading…" on 502/non-JSON bodies) ──
        async function api(url, data=null) {
            const opts = data
                ? { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }
                : { method: 'GET' };
            try {
                const res = await fetch(url, { ...opts, credentials: 'same-origin' });
                const ct = (res.headers.get('content-type') || '').toLowerCase();
                if (ct.includes('application/json')) {
                    return await res.json();
                }
                const text = await res.text();
                const snippet = (text || '').replace(/\s+/g, ' ').trim().slice(0, 180);
                return {
                    error: snippet || `Request failed (${res.status})`,
                    _httpStatus: res.status,
                };
            } catch (e) {
                return { error: e.message || 'Network error' };
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
